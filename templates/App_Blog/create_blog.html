{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title_block %}{% endblock %}

{% block body_block %}
<h2>Write Blog</h2>
<form method='POST' enctype="multipart/form-data">
    {% csrf_token %}
    {{form|crispy}}
    
    <button type='submit' class='btn btn-success btn-sm'>Publish Blog</button>
</form>
{% endblock %}
